<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Главная</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #1a1a20; color: #e6e6e6;
    display: flex; align-items: center; justify-content: center;
  }

  .card {
    background: #26262e;
    border: 1px solid #35353f;
    border-radius: 14px;
    padding: 40px 56px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    max-width: 520px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  p.subtitle {
    margin: 0 0 28px;
    color: #9aa0b4;
    font-size: 14px;
    line-height: 1.5;
  }

  a.bigLink {
    display: inline-block;
    padding: 14px 32px;
    background: #2ea043;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
    transition: transform .15s, background .15s, box-shadow .15s;
    box-shadow: 0 4px 16px rgba(46,160,67,.35);
  }
  a.bigLink:hover {
    background: #3fb950;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(46,160,67,.5);
  }
  a.bigLink:active {
    transform: translateY(0);
  }

  a.bigLink::before {
    content: "🤖 ";
  }

  .hint {
    margin-top: 24px;
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Учебный робот</h1>
    <p class="subtitle">
      Интерактивная среда для программирования<br>
      учебного конечного автомата на поле N×N.
    </p>
    <a class="bigLink" href="robot.htm">Открыть робота</a>
    <div class="hint">файл: robot.htm</div>
  </div>
</body>
</html>
