<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Учебный робот</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #eef1f4;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    min-height: 100vh;
  }
  .panel {
    background: #fff;
    border: 1px solid #c8cdd2;
    border-radius: 6px;
    padding: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  #leftPanel { display: flex; flex-direction: column; gap: 8px; width: 360px; }
  #codeArea {
    width: 100%;
    height: 420px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 18px;
    border: 1px solid #c8cdd2;
    border-radius: 4px;
    padding: 6px;
    resize: vertical;
    white-space: pre;
    overflow: auto;
    tab-size: 2;
  }
  #codeArea:focus { outline: 2px solid #4a90d9; }
  #codeLines {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 18px;
    white-space: pre;
    overflow: auto;
    height: 500px;
    max-height: 800px;
    border: 1px solid #c8cdd2;
    border-radius: 4px;
    background: #fafbfc;
    padding: 4px 6px;
  }
  .code-line { display: block; }
  .code-line.active { background: #cfe6ff; font-weight: bold; }
  #rightPanel { display: flex; flex-direction: column; gap: 10px; }
  #fieldWrap { position: relative; }
  #fieldCanvas { display: block; background: #fff; border: 1px solid #c8cdd2; border-radius: 4px; cursor: pointer; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    padding: 6px 12px;
    font-size: 13px;
    border: 1px solid #a8b0b8;
    border-radius: 4px;
    background: linear-gradient(#fdfdfd, #eef1f4);
    cursor: pointer;
  }
  button:hover { background: linear-gradient(#fff, #e3e8ee); }
  button:active { background: #d8dee5; }
  button.active { background: #4a90d9; color: #fff; border-color: #3a78b8; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    white-space: pre-wrap;
    min-height: 60px;
    background: #fafbfc;
    border: 1px solid #c8cdd2;
    border-radius: 4px;
    padding: 6px;
    line-height: 1.4;
  }
  #status.error { color: #c0392b; border-color: #e74c3c; background: #fdecea; }
  #status.finish { color: #1e8449; border-color: #27ae60; background: #eafaf1; }
  #hint {
    font-size: 12px;
    line-height: 1.5;
    background: #fafbfc;
    border: 1px solid #c8cdd2;
    border-radius: 4px;
    padding: 8px;
    max-width: 220px;
  }
  #hint h4 { margin: 0 0 6px 0; font-size: 12px; text-transform: uppercase; color: #555; }
  #hint code {
    background: #eef1f4;
    padding: 1px 4px;
    border-radius: 3px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  .row { display: flex; gap: 8px; align-items: flex-start; }
  #counter {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    font-weight: bold;
    color: #d35400;
  }
  label.chk { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
</style>
</head>
<body>

<div id="leftPanel" class="panel">
  <div class="row">
    <strong style="font-size:14px">Программа робота</strong>
    <span style="flex:1"></span>
  </div>
  <div id="codeLines"></div>
  <div class="controls">
    <button id="btnStartStop">▶ Пуск</button>
    <button id="btnStep">Шаг</button>
    <button id="btnReset" title="Сбросить выполнение, стереть следы, вернуть бонусы">Сброс</button>
    <label class="chk"><input type="checkbox" id="chkFast"> Быстрее</label>
  </div>
  <textarea id="codeArea" spellcheck="false"></textarea>
</div>

<div id="rightPanel">
  <div class="row">
    <div id="fieldWrap" class="panel">
      <canvas id="fieldCanvas"></canvas>
      <div id="status">Готов</div>
    </div>
    <div id="hint" class="panel">
      <h4>Команды</h4>
      <code>шаг</code> — вперёд<br>
      <code>право</code> / <code>лево</code> — поворот<br>
      <code>повтор</code> — беск. цикл<br>
      <code>выход</code> — выход из цикла<br>
      <code>если св</code> — клетка впереди свободна<br>
      <code>если занято</code> — впереди занято<br>
      <code>если св слева/справа</code><br>
      <code>если занято слева/справа</code><br>
      <hr style="border:none;border-top:1px solid #ddd;margin:8px 0">
      <h4>Поле</h4>
      <code>S</code> — старт<br>
      <code>E</code> — финиш<br>
      <code>X</code> — стена<br>
      <code>O</code> — бонус<br>
      <code>.</code> — пусто<br>
      <hr style="border:none;border-top:1px solid #ddd;margin:8px 0">
      <b>Бонусов:</b> <span id="counter">0</span>
    </div>
  </div>
  <div class="controls">
    <button id="btnCopyField">Копировать поле</button>
    <button id="btnPasteField">Вставить поле</button>
    <button id="btnRotate">Повернуть робота</button>
  </div>
</div>

<script src="robot.js"></script>
</body>
</html>
